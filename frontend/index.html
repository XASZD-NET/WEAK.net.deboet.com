
<script src="/app.js"></script>

<script>
(() => {
  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-input");
  const messages = document.getElementById("chat-messages");
  const sendButton = document.getElementById("send-chat");

  if (!form || !input || !messages || !sendButton) return;

  function addMessage(text, type = "ai") {
    const bubble = document.createElement("div");
    bubble.className = "bubble " + type;
    bubble.textContent = text;
    messages.appendChild(bubble);
    messages.scrollTop = messages.scrollHeight;
    return bubble;
  }

  // ใช้ capture เพื่อป้องกันตัวจัดการแชตเดิม
  // ใน app.js ทำงานซ้ำกับตัวใหม่นี้
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    event.stopImmediatePropagation();

    const question = input.value.trim();

    if (!question || sendButton.disabled) return;

    addMessage(question, "user");
    input.value = "";

    const loading = addMessage(
      "กำลังส่งคำถามไปยัง Gemini...",
      "ai"
    );

    sendButton.disabled = true;
    input.disabled = true;

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: question
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.details ||
          data.error ||
          "HTTP Error " + response.status
        );
      }

      if (typeof data.reply !== "string" || !data.reply.trim()) {
        throw new Error("Gemini ไม่ได้ส่งข้อความตอบกลับ");
      }

      loading.textContent = data.reply;

    } catch (error) {
      console.error("Gemini Assistant:", error);

      loading.textContent =
        "ไม่สามารถรับคำตอบจาก Gemini ได้\n" +
        error.message;

    } finally {
      sendButton.disabled = false;
      input.disabled = false;
      input.focus();
      messages.scrollTop = messages.scrollHeight;
    }

  }, true);
})();
</script>
</body>
</html>
